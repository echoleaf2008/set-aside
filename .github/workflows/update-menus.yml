name: Update menus and publish

on:
  schedule:
    # About 4:30 AM Central in winter, 5:30 AM in summer.
    - cron: '30 10 * * *'
  workflow_dispatch:
  push:
    branches: [static-menus-site]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch menus
        if: github.event_name != 'push'
        run: node scripts/sync.js

      # Committing also counts as repository activity, which keeps GitHub from
      # pausing this daily schedule after 60 quiet days.
      - name: Save menus
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/menus public/meta.json
          git diff --cached --quiet || git commit -m "Update menus"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
